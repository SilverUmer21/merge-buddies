<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merge Buddies — Asset Review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8ecd9;color:#603c2b;font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:30px 20px}h1{font-size:24px;margin:0 0 8px}p{max-width:640px}.layout{display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap}.phone{width:360px;padding:16px;background:#fff0d6;border-radius:24px}.board{width:328px;padding:10px;display:grid;grid-template-columns:repeat(4,71px);gap:8px;background:#ba7b48;border-radius:18px;box-shadow:0 4px 0 #73492f}.cell{width:71px;height:71px;border-radius:12px;background:#ebcb9d;box-shadow:inset 0 2px 3px #bd8c5740;display:flex;align-items:center;justify-content:center;overflow:hidden}.cell img{width:94px;max-width:none;height:94px;flex-shrink:0;object-fit:contain}.examples{display:flex;gap:16px;flex-wrap:wrap}.sample{width:180px;height:180px;background:#fff0d6;border-radius:16px;display:grid;place-items:center}.sample.dark{background:#493e37}.sample img{width:180px;height:180px;object-fit:contain}small{display:block;margin-top:12px}button{font:inherit;margin-top:22px;background:#75a947;color:#fff;border:2px solid #436a3f;border-radius:12px;padding:10px 16px;cursor:pointer}.pop img{animation:pop .28s ease-out}@keyframes pop{0%{transform:scale(.88,1.1)}45%{transform:scale(1.1,.9)}75%{transform:scale(.97,1.03)}100%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.pop img{animation:none}}
</style>
<main><h1>Apple family · asset review</h1><p>Art lab only. The board checks actual icon size and spacing; this is not the final game interface.</p><div class="layout"><section class="phone"><div class="board" id="board"></div><small>4 × 4 · 71 px cells · 360 px portrait width</small><button id="motion">Preview apple pop</button></section><section><div class="examples"><div class="sample"><img src="../masters/apple-01-v1.png" alt="Approved apple on cream"></div><div class="sample dark"><img src="../masters/apple-01-v1.png" alt="Approved apple on dark background"></div></div><p>Approved visual seed: apple v1.<br>Apple and pie: approved.<br>Slices and filling: ready for your review.</p></section></div></main>
<script>const board=document.querySelector('#board');for(let i=0;i<16;i++){const cell=document.createElement('div');cell.className='cell';if(i!==7&&i!==10){const im=document.createElement('img');const stage=i%4;im.src=['../masters/apple-01-v1.png','apple-02-v1.png','apple-03-v1.png','apple-04-v1.png'][stage];im.alt=['Apple','Sliced apples','Apple filling','Apple pie'][stage];im.style.width=[94,87,85,86][stage]+'px';im.style.height=im.style.width;cell.append(im)}board.append(cell)}document.querySelector('#motion').onclick=()=>{board.classList.remove('pop');void board.offsetWidth;board.classList.add('pop')};</script></html>
